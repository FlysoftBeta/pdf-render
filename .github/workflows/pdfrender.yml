name: pdfrender

on:
  push:
    paths:
      - ".github/workflows/pdfrender.yml"
      - "utils/pdfrender*"
      - "utils/PdfRenderBundle*"
      - "examples/pdfrender*"
      - "poppler/**"
      - "CMakeLists.txt"
      - "utils/CMakeLists.txt"
  pull_request:
    paths:
      - ".github/workflows/pdfrender.yml"
      - "utils/pdfrender*"
      - "utils/PdfRenderBundle*"
      - "examples/pdfrender*"
      - "poppler/**"
      - "CMakeLists.txt"
      - "utils/CMakeLists.txt"
  workflow_dispatch:

jobs:
  linux-debian:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          cmake ninja-build g++ libcairo2-dev libfontconfig1-dev libfreetype-dev
          libjpeg-turbo8-dev libopenjp2-7-dev libwebp-dev libzstd-dev zlib1g-dev
          poppler-data
      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DENABLE_CPP=OFF -DENABLE_GLIB=OFF -DENABLE_QT5=OFF -DENABLE_QT6=OFF
          -DENABLE_BOOST=OFF -DENABLE_LIBOPENJPEG=ON -DENABLE_LIBJPEG=ON
          -DENABLE_LCMS=OFF -DENABLE_LIBCURL=OFF -DENABLE_LIBTIFF=OFF
          -DENABLE_NSS3=OFF -DENABLE_GPGME=OFF -DBUILD_SHARED_LIBS=OFF
          -DBUILD_CPP_TESTS=OFF -DBUILD_MANUAL_TESTS=OFF
      - name: Build pdfrender
        run: cmake --build build --target pdfrender
      - name: Package pdfrender
        run: |
          package=pdfrender-linux-debian-x86_64
          mkdir -p "dist/$package/share" "dist/$package/licenses/poppler-data"
          install -m 0755 build/utils/pdfrender "dist/$package/"
          strip --strip-unneeded "dist/$package/pdfrender"
          cp -a /usr/share/poppler "dist/$package/share/"
          install -m 0644 /usr/share/doc/poppler-data/copyright \
            "dist/$package/licenses/poppler-data/"
          install -m 0644 \
            examples/pdfrender-bundle-parser.mjs \
            utils/pdfrender.md \
            COPYING COPYING3 \
            "dist/$package/"
          test -f "dist/$package/share/poppler/cidToUnicode/Adobe-GB1"
          test -f "dist/$package/share/poppler/cMap/Adobe-GB1/Adobe-GB1-UCS2"
          ldd "dist/$package/pdfrender" | grep -q 'libjpeg\.so'
          ldd "dist/$package/pdfrender" | grep -q 'libopenjp2\.so'
          tar -C dist -czf "dist/$package.tar.gz" "$package"
      - name: Upload pdfrender artifact
        uses: actions/upload-artifact@v6
        with:
          name: pdfrender-linux-debian-x86_64
          path: dist/pdfrender-linux-debian-x86_64.tar.gz
          if-no-files-found: error

  linux-redhat:
    runs-on: ubuntu-24.04
    container: fedora:44
    steps:
      - name: Install dependencies
        run: >-
          dnf install -y
          git tar gzip coreutils binutils
          cmake ninja-build gcc-c++ cairo-devel fontconfig-devel freetype-devel
          libjpeg-turbo-devel openjpeg-devel libwebp-devel libzstd-devel
          zlib-ng-compat-devel poppler-data
      - uses: actions/checkout@v7
      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DENABLE_CPP=OFF -DENABLE_GLIB=OFF -DENABLE_QT5=OFF -DENABLE_QT6=OFF
          -DENABLE_BOOST=OFF -DENABLE_LIBOPENJPEG=ON -DENABLE_LIBJPEG=ON
          -DENABLE_LCMS=OFF -DENABLE_LIBCURL=OFF -DENABLE_LIBTIFF=OFF
          -DENABLE_NSS3=OFF -DENABLE_GPGME=OFF -DBUILD_SHARED_LIBS=OFF
          -DBUILD_CPP_TESTS=OFF -DBUILD_MANUAL_TESTS=OFF
      - name: Build pdfrender
        run: cmake --build build --target pdfrender
      - name: Package pdfrender
        run: |
          package=pdfrender-linux-redhat-x86_64
          mkdir -p "dist/$package/share" "dist/$package/licenses/poppler-data"
          install -m 0755 build/utils/pdfrender "dist/$package/"
          strip --strip-unneeded "dist/$package/pdfrender"
          cp -a /usr/share/poppler "dist/$package/share/"
          cp -a /usr/share/licenses/poppler-data/. \
            "dist/$package/licenses/poppler-data/"
          install -m 0644 \
            examples/pdfrender-bundle-parser.mjs \
            utils/pdfrender.md \
            COPYING COPYING3 \
            "dist/$package/"
          test -f "dist/$package/share/poppler/cidToUnicode/Adobe-GB1"
          test -f "dist/$package/share/poppler/cMap/Adobe-GB1/Adobe-GB1-UCS2"
          ldd "dist/$package/pdfrender" | grep -q 'libjpeg\.so'
          ldd "dist/$package/pdfrender" | grep -q 'libopenjp2\.so'
          tar -C dist -czf "dist/$package.tar.gz" "$package"
      - name: Upload pdfrender artifact
        uses: actions/upload-artifact@v6
        with:
          name: pdfrender-linux-redhat-x86_64
          path: dist/pdfrender-linux-redhat-x86_64.tar.gz
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          path-type: inherit
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-cairo
            mingw-w64-ucrt-x86_64-freetype
            mingw-w64-ucrt-x86_64-libjpeg-turbo
            mingw-w64-ucrt-x86_64-openjpeg2
            mingw-w64-ucrt-x86_64-poppler-data
            mingw-w64-ucrt-x86_64-libwebp
            mingw-w64-ucrt-x86_64-zlib
            mingw-w64-ucrt-x86_64-zstd
      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja -DFONT_CONFIGURATION=win32
          -DCMAKE_BUILD_TYPE=Release
          -DENABLE_CPP=OFF -DENABLE_GLIB=OFF -DENABLE_QT5=OFF -DENABLE_QT6=OFF
          -DENABLE_BOOST=OFF -DENABLE_LIBOPENJPEG=ON -DENABLE_LIBJPEG=ON
          -DENABLE_LCMS=OFF -DENABLE_LIBCURL=OFF -DENABLE_LIBTIFF=OFF
          -DENABLE_NSS3=OFF -DENABLE_GPGME=OFF -DBUILD_SHARED_LIBS=OFF
          -DBUILD_CPP_TESTS=OFF -DBUILD_MANUAL_TESTS=OFF
      - name: Build pdfrender
        run: cmake --build build --target pdfrender
      - name: Package pdfrender
        run: |
          package=pdfrender-windows-x86_64
          mkdir -p "dist/$package/share" "dist/$package/licenses"
          cp build/utils/pdfrender.exe "dist/$package/"
          strip --strip-unneeded "dist/$package/pdfrender.exe"
          cp -a /ucrt64/share/poppler "dist/$package/share/"
          cp -a /ucrt64/share/licenses/poppler-data \
            "dist/$package/licenses/"
          ldd build/utils/pdfrender.exe \
            | awk '$3 ~ /^\/ucrt64\/bin\// { print $3 }' \
            > dist/runtime-dlls.txt
          test -s dist/runtime-dlls.txt
          while IFS= read -r dll; do
            cp "$dll" "dist/$package/"
          done < dist/runtime-dlls.txt
          cp \
            examples/pdfrender-bundle-parser.mjs \
            utils/pdfrender.md \
            COPYING COPYING3 \
            "dist/$package/"
          test -f "dist/$package/share/poppler/cidToUnicode/Adobe-GB1"
          test -f "dist/$package/share/poppler/cMap/Adobe-GB1/Adobe-GB1-UCS2"
          grep -Ei 'libjpeg[^/]*\.dll' dist/runtime-dlls.txt
          grep -Ei 'libopenjp2[^/]*\.dll' dist/runtime-dlls.txt
          cd dist
          cmake -E tar cf "$package.zip" --format=zip "$package"
      - name: Upload pdfrender artifact
        uses: actions/upload-artifact@v6
        with:
          name: pdfrender-windows-x86_64
          path: dist/pdfrender-windows-x86_64.zip
          if-no-files-found: error
